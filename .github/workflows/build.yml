name: Build Check

on:
  push:
    branches: [ fixup, fixup-pre, fixup-test, perf/pi3-optimize ]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
    - uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: "1.24"
    - name: Set up Chrome for browser fixtures
      id: chrome
      uses: browser-actions/setup-chrome@v1
      with:
        chrome-version: stable
    - name: Verify
      env:
        ROD_BROWSER_BIN: ${{ steps.chrome.outputs.chrome-path }}
      run: |
        go test -mod=readonly -timeout=20m ./...
        go test -mod=readonly -race -run 'TestTimedOutStartupKeepsSingleFactory|TestCanceledAcquireDoesNotTakeAvailableToken' ./browser
        go build -mod=readonly ./...
        (cd third_party/headless_browser && go test -mod=readonly -timeout=10m ./...)

  build:
    needs: verify
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64]
        include:
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: arm64
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: "1.24"
    - name: Build
      run: |
        export GOOS=${{ matrix.goos }}
        export GOARCH=${{ matrix.goarch }}
        export GOFLAGS=-buildvcs=false
        export CGO_ENABLED=0
        EXT=""
        if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi
        mkdir -p dist
        # -trimpath 去掉构建机绝对路径；-s -w 去掉符号表与调试信息。
        # 产物直接拷进树莓派 SD 卡，体积与页缓存占用都要省。
        go build -mod=readonly -v -trimpath -ldflags="-s -w" -o "dist/xiaohongshu-mcp-${GOOS}-${GOARCH}${EXT}" .
        ls -l "dist/xiaohongshu-mcp-${GOOS}-${GOARCH}${EXT}"
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: xiaohongshu-mcp-${{ matrix.goos }}-${{ matrix.goarch }}
        path: dist/xiaohongshu-mcp-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.exe' || '' }}
        if-no-files-found: error
